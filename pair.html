<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIDD FREE BOT — Pairing</title>
<style>
    :root {
        --bg: #0b0d10;
        --panel: #101317;
        --border: #1f242b;
        --text: #e8eaed;
        --muted: #7a8290;
        --accent: #3ddc84;
        --accent-dim: rgba(61, 220, 132, 0.12);
        --mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        background-image:
            radial-gradient(circle at 20% 10%, rgba(61,220,132,0.06), transparent 40%),
            radial-gradient(circle at 80% 90%, rgba(61,220,132,0.04), transparent 40%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .card {
        width: 100%;
        max-width: 380px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px 28px;
    }

    .eyebrow {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 6px;
    }

    h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
    }

    .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 28px;
        line-height: 1.5;
    }

    label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
    }

    input[type="text"] {
        width: 100%;
        background: #0d0f13;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 13px 14px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 15px;
        letter-spacing: 0.02em;
        outline: none;
        transition: border-color 0.15s ease;
    }

    input[type="text"]:focus {
        border-color: var(--accent);
    }

    input[type="text"]::placeholder {
        color: #4a5058;
    }

    button {
        width: 100%;
        margin-top: 18px;
        padding: 13px;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: #06130a;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: filter 0.15s ease, transform 0.1s ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.99); }
    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .result {
        margin-top: 24px;
        display: none;
    }

    .result.visible { display: block; }

    .result-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 10px;
    }

    .code-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--accent-dim);
        border: 1px solid rgba(61,220,132,0.25);
        border-radius: 8px;
        padding: 6px 6px 6px 16px;
    }

    .code {
        font-family: var(--mono);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--accent);
        flex: 1;
        text-align: center;
    }

    .copy-btn {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 6px;
        border: none;
        background: rgba(61, 220, 132, 0.2);
        color: var(--accent);
        font-size: 20px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
    }

    .copy-btn:hover {
        background: rgba(61, 220, 132, 0.35);
    }
    .copy-btn:active { transform: scale(0.92); }

    .copy-feedback {
        font-size: 12px;
        color: var(--accent);
        text-align: right;
        margin-top: 6px;
        height: 20px;
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .copy-feedback.visible {
        opacity: 1;
    }

    .error {
        margin-top: 16px;
        font-size: 13px;
        color: #ff6b6b;
        display: none;
    }

    .error.visible { display: block; }

    .footer {
        margin-top: 28px;
        text-align: center;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        color: #3a4048;
        text-transform: uppercase;
    }
</style>
</head>
<body>

<div class="card">
    <p class="eyebrow">WhatsApp Connection</p>
    <h1>DARAXII-NX MINI BOT V1</h1>
    <p class="subtitle">Enter your WhatsApp number with country code to receive a pairing code.</p>

    <label for="phone">Phone number</label>
    <input type="text" id="phone" placeholder="+1XXXXXXXXXX" inputmode="tel" />

    <button id="submitBtn">Get Pairing Code</button>

    <div class="error" id="errorBox"></div>

    <div class="result" id="resultBox">
        <p class="result-label">Pairing Code</p>
        <div class="code-wrapper">
            <div class="code" id="codeValue">— — — — — — — —</div>
            <button class="copy-btn" id="copyBtn" title="Copier le code">📋</button>
        </div>
        <div class="copy-feedback" id="copyFeedback">Copié !</div>
    </div>

    <p class="footer">MADE IN BAY SIDD TECHX</p>
</div>

<script>
    const btn = document.getElementById("submitBtn");
    const phoneInput = document.getElementById("phone");
    const resultBox = document.getElementById("resultBox");
    const codeValue = document.getElementById("codeValue");
    const errorBox = document.getElementById("errorBox");
    const copyBtn = document.getElementById("copyBtn");
    const copyFeedback = document.getElementById("copyFeedback");

    btn.addEventListener("click", async () => {
        const number = phoneInput.value.trim();
        errorBox.classList.remove("visible");
        resultBox.classList.remove("visible");
        copyFeedback.classList.remove("visible");

        if (!number) {
            errorBox.textContent = "Please enter a phone number.";
            errorBox.classList.add("visible");
            return;
        }

        btn.disabled = true;
        btn.textContent = "Requesting...";

        try {
            const res = await fetch("/api/pair", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ number })
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.error || "Failed to get pairing code");
            }

            codeValue.textContent = data.code;
            resultBox.classList.add("visible");
        } catch (err) {
            errorBox.textContent = err.message;
            errorBox.classList.add("visible");
        } finally {
            btn.disabled = false;
            btn.textContent = "Get Pairing Code";
        }
    });

    // Copier le code
    copyBtn.addEventListener("click", async () => {
        const code = codeValue.textContent;
        if (!code || code === "— — — — — — — —") return;
        try {
            await navigator.clipboard.writeText(code);
            copyFeedback.classList.add("visible");
            setTimeout(() => copyFeedback.classList.remove("visible"), 2000);
        } catch (err) {
            // fallback : sélection manuelle
            const range = document.createRange();
            range.selectNode(codeValue);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand("copy");
            copyFeedback.classList.add("visible");
            setTimeout(() => copyFeedback.classList.remove("visible"), 2000);
        }
    });
</script>

</body>
</html>
